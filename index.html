<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blooket Designing | Advanced Backgrounds</title>
  <link href="https://fonts.googleapis.com/css2?family=Titan+One&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background-color: #0bc2cf;
      height: 100%;
      overflow: hidden;
      font-family: 'Nunito', sans-serif;
    }

    #controls {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      max-height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(10px);
      padding: 15px;
      z-index: 10;
      color: white;
      overflow-y: auto;
      transition: transform 0.3s ease;
    }

    #controls.collapsed {
      transform: translateY(-100%);
    }

    .toggle-btn {
      position: fixed;
      top: 10px;
      right: 10px;
      z-index: 11;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-family: 'Titan One', sans-serif;
      font-size: 14px;
      transition: background 0.3s;
    }

    .toggle-btn:hover {
      background: rgba(0, 0, 0, 0.9);
    }

    .control-section {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 15px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .control-section h3 {
      margin: 0 0 15px 0;
      font-family: 'Titan One', sans-serif;
      font-size: 16px;
      color: #00d4ff;
      text-transform: uppercase;
    }

    .control-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
    }

    label {
      display: flex;
      flex-direction: column;
      gap: 5px;
      font-weight: 600;
      font-size: 13px;
    }

    input[type="text"],
    input[type="number"],
    select {
      width: 100%;
      padding: 8px;
      font-family: 'Nunito', sans-serif;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background: rgba(255, 255, 255, 0.9);
      outline: none;
      font-size: 13px;
    }

    input[type="range"] {
      width: 100%;
    }

    input[type="color"] {
      width: 60px;
      height: 40px;
      cursor: pointer;
      border: 2px solid rgba(255, 255, 255, 0.5);
      border-radius: 6px;
    }

    .color-input-group {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    .color-input-group input[type="text"] {
      flex: 1;
    }

    button {
      font-family: 'Titan One', sans-serif;
      font-size: 14px;
      padding: 12px 24px;
      border: none;
      border-radius: 10px;
      color: white;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
    }

    button:active {
      transform: translateY(0);
    }

    .button-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 15px;
    }

    .preset-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 10px;
    }

    .preset-btn {
      padding: 8px;
      font-size: 12px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    .color-stop {
      background: rgba(255, 255, 255, 0.05);
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .color-stop-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .remove-color-btn {
      background: #ff4444;
      padding: 5px 10px;
      font-size: 11px;
    }

    .add-color-btn {
      background: #44ff44;
      width: 100%;
      margin-top: 10px;
    }

    .value-display {
      font-size: 12px;
      color: #00d4ff;
      font-weight: bold;
    }

    .rotated-container {
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      transform: rotate(10deg);
      transform-origin: center;
      pointer-events: none;
    }

    .pattern-fill {
      width: 100%;
      height: 100%;
      background-color: #24c8d4;
      animation: movePattern 30s linear infinite;
      -webkit-mask-image: url('https://blooket-designing.neocities.org/Assets/Main/BlookCheckers.png');
      -webkit-mask-repeat: repeat;
      -webkit-mask-size: 500px 500px;
      -webkit-mask-position: 0 0;
      mask-image: url('https://blooket-designing.neocities.org/Assets/Main/BlookCheckers.png');
      mask-repeat: repeat;
      mask-size: 500px 500px;
      mask-position: 0 0;
    }

    @keyframes movePattern {
      0% { mask-position: 0 0; -webkit-mask-position: 0 0; }
      100% { mask-position: 1000px 1000px; -webkit-mask-position: 1000px 1000px; }
    }

    @keyframes movePatternReverse {
      0% { mask-position: 1000px 1000px; -webkit-mask-position: 1000px 1000px; }
      100% { mask-position: 0 0; -webkit-mask-position: 0 0; }
    }
  </style>
</head>
<body>
  <button class="toggle-btn" id="toggleBtn">Toggle Controls</button>

  <div id="controls">
    <h2 style="margin: 0 0 20px 0; font-family: 'Titan One', sans-serif; color: #00d4ff; text-align: center;">
      🎨 Advanced Blooket Background Designer
    </h2>

    <!-- Background Section -->
    <div class="control-section">
      <h3>📐 Background Settings</h3>
      <div class="control-grid">
        <label>
          Background Type
          <select id="bgType">
            <option value="solid">Solid Color</option>
            <option value="linear">Linear Gradient</option>
            <option value="radial">Radial Gradient</option>
            <option value="conic">Conic Gradient</option>
          </select>
        </label>
        <label id="gradientAngleLabel" style="display: none;">
          Gradient Angle: <span class="value-display" id="angleDisplay">90°</span>
          <input type="range" id="gradientAngle" min="0" max="360" value="90">
        </label>
      </div>

      <div id="bgColorStops">
        <div class="color-stop">
          <div class="color-stop-header">
            <strong>Color Stop 1</strong>
          </div>
          <div class="control-grid">
            <div class="color-input-group">
              <input type="text" class="bg-color-text" value="#0bc2cf" data-index="0">
              <input type="color" class="bg-color-picker" value="#0bc2cf" data-index="0">
            </div>
            <label>
              Position: <span class="value-display position-display">0%</span>
              <input type="range" class="bg-color-position" min="0" max="100" value="0" data-index="0">
            </label>
          </div>
        </div>
        <div class="color-stop">
          <div class="color-stop-header">
            <strong>Color Stop 2</strong>
            <button class="remove-color-btn" onclick="removeBackgroundColor(1)">Remove</button>
          </div>
          <div class="control-grid">
            <div class="color-input-group">
              <input type="text" class="bg-color-text" value="#24c8d4" data-index="1">
              <input type="color" class="bg-color-picker" value="#24c8d4" data-index="1">
            </div>
            <label>
              Position: <span class="value-display position-display">100%</span>
              <input type="range" class="bg-color-position" min="0" max="100" value="100" data-index="1">
            </label>
          </div>
        </div>
      </div>
      <button class="add-color-btn" onclick="addBackgroundColor()">+ Add Color Stop</button>
    </div>

    <!-- Pattern Section -->
    <div class="control-section">
      <h3>🎭 Pattern Settings</h3>
      <div class="control-grid">
        <label>
          Pattern Type
          <select id="patternType">
            <option value="solid">Solid Color</option>
            <option value="linear">Linear Gradient</option>
            <option value="radial">Radial Gradient</option>
            <option value="conic">Conic Gradient</option>
          </select>
        </label>
        <label id="patternAngleLabel" style="display: none;">
          Pattern Gradient Angle: <span class="value-display" id="patternAngleDisplay">90°</span>
          <input type="range" id="patternGradientAngle" min="0" max="360" value="90">
        </label>
      </div>

      <div id="patternColorStops">
        <div class="color-stop">
          <div class="color-stop-header">
            <strong>Pattern Color 1</strong>
          </div>
          <div class="control-grid">
            <div class="color-input-group">
              <input type="text" class="pattern-color-text" value="#24c8d4" data-index="0">
              <input type="color" class="pattern-color-picker" value="#24c8d4" data-index="0">
            </div>
            <label>
              Position: <span class="value-display position-display">0%</span>
              <input type="range" class="pattern-color-position" min="0" max="100" value="0" data-index="0">
            </label>
          </div>
        </div>
      </div>
      <button class="add-color-btn" onclick="addPatternColor()">+ Add Pattern Color</button>

      <div class="control-grid" style="margin-top: 15px;">
        <label>
          Pattern Opacity: <span class="value-display" id="patternOpacityDisplay">100%</span>
          <input type="range" id="patternOpacity" min="0" max="100" value="100">
        </label>
        <label>
          Pattern Size: <span class="value-display" id="patternSizeDisplay">500px</span>
          <input type="range" id="patternSize" min="100" max="1000" value="500" step="50">
        </label>
        <label>
          Pattern Rotation: <span class="value-display" id="patternRotationDisplay">10°</span>
          <input type="range" id="patternRotation" min="-180" max="180" value="10">
        </label>
        <label>
          Blend Mode
          <select id="blendMode">
            <option value="normal">Normal</option>
            <option value="multiply">Multiply</option>
            <option value="screen">Screen</option>
            <option value="overlay">Overlay</option>
            <option value="darken">Darken</option>
            <option value="lighten">Lighten</option>
            <option value="color-dodge">Color Dodge</option>
            <option value="color-burn">Color Burn</option>
            <option value="hard-light">Hard Light</option>
            <option value="soft-light">Soft Light</option>
            <option value="difference">Difference</option>
            <option value="exclusion">Exclusion</option>
            <option value="hue">Hue</option>
            <option value="saturation">Saturation</option>
            <option value="color">Color</option>
            <option value="luminosity">Luminosity</option>
          </select>
        </label>
      </div>
    </div>

    <!-- Animation Section -->
    <div class="control-section">
      <h3>⚡ Animation Settings</h3>
      <div class="control-grid">
        <label>
          Animation Speed: <span class="value-display" id="animSpeedDisplay">30s</span>
          <input type="range" id="animationSpeed" min="5" max="120" value="30" step="5">
        </label>
        <label>
          Animation Direction
          <select id="animationDirection">
            <option value="normal">Forward</option>
            <option value="reverse">Reverse</option>
            <option value="alternate">Alternate</option>
            <option value="alternate-reverse">Alternate Reverse</option>
          </select>
        </label>
        <label>
          <input type="checkbox" id="animationEnabled" checked style="width: auto; margin-right: 5px;">
          Enable Animation
        </label>
      </div>
    </div>

    <!-- Presets Section -->
    <div class="control-section">
      <h3>🎨 Presets</h3>
      <div class="preset-grid">
        <button class="preset-btn" onclick="applyPreset('ocean')">Ocean Waves</button>
        <button class="preset-btn" onclick="applyPreset('sunset')">Sunset Blaze</button>
        <button class="preset-btn" onclick="applyPreset('forest')">Forest Mist</button>
        <button class="preset-btn" onclick="applyPreset('aurora')">Aurora Sky</button>
        <button class="preset-btn" onclick="applyPreset('neon')">Neon Nights</button>
        <button class="preset-btn" onclick="applyPreset('candy')">Candy Shop</button>
        <button class="preset-btn" onclick="applyPreset('fire')">Fire & Ice</button>
        <button class="preset-btn" onclick="applyPreset('galaxy')">Galaxy</button>
        <button class="preset-btn" onclick="applyPreset('emerald')">Emerald City</button>
        <button class="preset-btn" onclick="applyPreset('purple')">Purple Dream</button>
        <button class="preset-btn" onclick="applyPreset('rainbow')">Rainbow</button>
        <button class="preset-btn" onclick="applyPreset('gold')">Golden Hour</button>
      </div>
    </div>

    <!-- Export Section -->
    <div class="control-section">
      <h3>💾 Export</h3>
      <div class="button-group">
        <button id="saveHtmlBtn">Save as HTML</button>
        <button id="saveImageBtn">Save as Image</button>
        <button id="copyConfigBtn">Copy Config</button>
        <button id="loadConfigBtn">Load Config</button>
      </div>
    </div>
  </div>

  <div class="rotated-container" id="rotatedContainer">
    <div class="pattern-fill" id="pattern"></div>
  </div>

  <script>
    // State management
    let bgColors = [
      { color: '#0bc2cf', position: 0 },
      { color: '#24c8d4', position: 100 }
    ];
    let patternColors = [
      { color: '#24c8d4', position: 0 }
    ];

    // Elements
    const pattern = document.getElementById('pattern');
    const rotatedContainer = document.getElementById('rotatedContainer');
    const toggleBtn = document.getElementById('toggleBtn');
    const controls = document.getElementById('controls');

    // Toggle controls
    toggleBtn.addEventListener('click', () => {
      controls.classList.toggle('collapsed');
    });

    // Utility: Validate hex color
    function isValidHex(hex) {
      return /^#([0-9A-F]{6})$/i.test(hex);
    }

    // Background type change
    document.getElementById('bgType').addEventListener('change', (e) => {
      const isGradient = e.target.value !== 'solid';
      document.getElementById('gradientAngleLabel').style.display = isGradient && e.target.value === 'linear' ? 'flex' : 'none';
      updateBackground();
    });

    // Pattern type change
    document.getElementById('patternType').addEventListener('change', (e) => {
      const isGradient = e.target.value !== 'solid';
      document.getElementById('patternAngleLabel').style.display = isGradient && e.target.value === 'linear' ? 'flex' : 'none';
      updatePattern();
    });

    // Gradient angle
    document.getElementById('gradientAngle').addEventListener('input', (e) => {
      document.getElementById('angleDisplay').textContent = e.target.value + '°';
      updateBackground();
    });

    document.getElementById('patternGradientAngle').addEventListener('input', (e) => {
      document.getElementById('patternAngleDisplay').textContent = e.target.value + '°';
      updatePattern();
    });

    // Pattern controls
    document.getElementById('patternOpacity').addEventListener('input', (e) => {
      document.getElementById('patternOpacityDisplay').textContent = e.target.value + '%';
      pattern.style.opacity = e.target.value / 100;
    });

    document.getElementById('patternSize').addEventListener('input', (e) => {
      document.getElementById('patternSizeDisplay').textContent = e.target.value + 'px';
      const size = e.target.value + 'px';
      pattern.style.maskSize = size + ' ' + size;
      pattern.style.webkitMaskSize = size + ' ' + size;
    });

    document.getElementById('patternRotation').addEventListener('input', (e) => {
      document.getElementById('patternRotationDisplay').textContent = e.target.value + '°';
      rotatedContainer.style.transform = `rotate(${e.target.value}deg)`;
    });

    document.getElementById('blendMode').addEventListener('change', (e) => {
      pattern.style.mixBlendMode = e.target.value;
    });

    // Animation controls
    document.getElementById('animationSpeed').addEventListener('input', (e) => {
      document.getElementById('animSpeedDisplay').textContent = e.target.value + 's';
      updateAnimation();
    });

    document.getElementById('animationDirection').addEventListener('change', updateAnimation);
    document.getElementById('animationEnabled').addEventListener('change', updateAnimation);

    function updateAnimation() {
      const speed = document.getElementById('animationSpeed').value;
      const direction = document.getElementById('animationDirection').value;
      const enabled = document.getElementById('animationEnabled').checked;

      if (enabled) {
        pattern.style.animation = `movePattern ${speed}s linear infinite ${direction}`;
      } else {
        pattern.style.animation = 'none';
      }
    }

    // Add background color
    function addBackgroundColor() {
      const index = bgColors.length;
      bgColors.push({ color: '#ffffff', position: 50 });

      const colorStop = document.createElement('div');
      colorStop.className = 'color-stop';
      colorStop.innerHTML = `
        <div class="color-stop-header">
          <strong>Color Stop ${index + 1}</strong>
          <button class="remove-color-btn" onclick="removeBackgroundColor(${index})">Remove</button>
        </div>
        <div class="control-grid">
          <div class="color-input-group">
            <input type="text" class="bg-color-text" value="#ffffff" data-index="${index}">
            <input type="color" class="bg-color-picker" value="#ffffff" data-index="${index}">
          </div>
          <label>
            Position: <span class="value-display position-display">50%</span>
            <input type="range" class="bg-color-position" min="0" max="100" value="50" data-index="${index}">
          </label>
        </div>
      `;

      document.getElementById('bgColorStops').appendChild(colorStop);
      setupColorInputs();
      updateBackground();
    }

    // Remove background color
    function removeBackgroundColor(index) {
      if (bgColors.length <= 1) {
        alert('You must have at least one color!');
        return;
      }
      bgColors.splice(index, 1);
      rebuildBackgroundColorStops();
    }

    // Add pattern color
    function addPatternColor() {
      const index = patternColors.length;
      patternColors.push({ color: '#ffffff', position: 50 });

      const colorStop = document.createElement('div');
      colorStop.className = 'color-stop';
      colorStop.innerHTML = `
        <div class="color-stop-header">
          <strong>Pattern Color ${index + 1}</strong>
          <button class="remove-color-btn" onclick="removePatternColor(${index})">Remove</button>
        </div>
        <div class="control-grid">
          <div class="color-input-group">
            <input type="text" class="pattern-color-text" value="#ffffff" data-index="${index}">
            <input type="color" class="pattern-color-picker" value="#ffffff" data-index="${index}">
          </div>
          <label>
            Position: <span class="value-display position-display">50%</span>
            <input type="range" class="pattern-color-position" min="0" max="100" value="50" data-index="${index}">
          </label>
        </div>
      `;

      document.getElementById('patternColorStops').appendChild(colorStop);
      setupColorInputs();
      updatePattern();
    }

    // Remove pattern color
    function removePatternColor(index) {
      if (patternColors.length <= 1) {
        alert('You must have at least one color!');
        return;
      }
      patternColors.splice(index, 1);
      rebuildPatternColorStops();
    }

    // Rebuild color stops
    function rebuildBackgroundColorStops() {
      const container = document.getElementById('bgColorStops');
      container.innerHTML = '';

      bgColors.forEach((colorData, index) => {
        const colorStop = document.createElement('div');
        colorStop.className = 'color-stop';
        colorStop.innerHTML = `
          <div class="color-stop-header">
            <strong>Color Stop ${index + 1}</strong>
            ${index > 0 ? `<button class="remove-color-btn" onclick="removeBackgroundColor(${index})">Remove</button>` : ''}
          </div>
          <div class="control-grid">
            <div class="color-input-group">
              <input type="text" class="bg-color-text" value="${colorData.color}" data-index="${index}">
              <input type="color" class="bg-color-picker" value="${colorData.color}" data-index="${index}">
            </div>
            <label>
              Position: <span class="value-display position-display">${colorData.position}%</span>
              <input type="range" class="bg-color-position" min="0" max="100" value="${colorData.position}" data-index="${index}">
            </label>
          </div>
        `;
        container.appendChild(colorStop);
      });

      setupColorInputs();
      updateBackground();
    }

    function rebuildPatternColorStops() {
      const container = document.getElementById('patternColorStops');
      container.innerHTML = '';

      patternColors.forEach((colorData, index) => {
        const colorStop = document.createElement('div');
        colorStop.className = 'color-stop';
        colorStop.innerHTML = `
          <div class="color-stop-header">
            <strong>Pattern Color ${index + 1}</strong>
            ${index > 0 ? `<button class="remove-color-btn" onclick="removePatternColor(${index})">Remove</button>` : ''}
          </div>
          <div class="control-grid">
            <div class="color-input-group">
              <input type="text" class="pattern-color-text" value="${colorData.color}" data-index="${index}">
              <input type="color" class="pattern-color-picker" value="${colorData.color}" data-index="${index}">
            </div>
            <label>
              Position: <span class="value-display position-display">${colorData.position}%</span>
              <input type="range" class="pattern-color-position" min="0" max="100" value="${colorData.position}" data-index="${index}">
            </label>
          </div>
        `;
        container.appendChild(colorStop);
      });

      setupColorInputs();
      updatePattern();
    }

    // Setup color inputs
    function setupColorInputs() {
      // Background colors
      document.querySelectorAll('.bg-color-text').forEach(input => {
        input.addEventListener('input', (e) => {
          const index = parseInt(e.target.dataset.index);
          if (isValidHex(e.target.value)) {
            bgColors[index].color = e.target.value;
            document.querySelector(`.bg-color-picker[data-index="${index}"]`).value = e.target.value;
            updateBackground();
          }
        });
      });

      document.querySelectorAll('.bg-color-picker').forEach(input => {
        input.addEventListener('input', (e) => {
          const index = parseInt(e.target.dataset.index);
          bgColors[index].color = e.target.value;
          document.querySelector(`.bg-color-text[data-index="${index}"]`).value = e.target.value;
          updateBackground();
        });
      });

      document.querySelectorAll('.bg-color-position').forEach(input => {
        input.addEventListener('input', (e) => {
          const index = parseInt(e.target.dataset.index);
          bgColors[index].position = parseInt(e.target.value);
          e.target.parentElement.querySelector('.position-display').textContent = e.target.value + '%';
          updateBackground();
        });
      });

      // Pattern colors
      document.querySelectorAll('.pattern-color-text').forEach(input => {
        input.addEventListener('input', (e) => {
          const index = parseInt(e.target.dataset.index);
          if (isValidHex(e.target.value)) {
            patternColors[index].color = e.target.value;
            document.querySelector(`.pattern-color-picker[data-index="${index}"]`).value = e.target.value;
            updatePattern();
          }
        });
      });

      document.querySelectorAll('.pattern-color-picker').forEach(input => {
        input.addEventListener('input', (e) => {
          const index = parseInt(e.target.dataset.index);
          patternColors[index].color = e.target.value;
          document.querySelector(`.pattern-color-text[data-index="${index}"]`).value = e.target.value;
          updatePattern();
        });
      });

      document.querySelectorAll('.pattern-color-position').forEach(input => {
        input.addEventListener('input', (e) => {
          const index = parseInt(e.target.dataset.index);
          patternColors[index].position = parseInt(e.target.value);
          e.target.parentElement.querySelector('.position-display').textContent = e.target.value + '%';
          updatePattern();
        });
      });
    }

    // Update background
    function updateBackground() {
      const type = document.getElementById('bgType').value;

      if (type === 'solid') {
        document.body.style.background = bgColors[0].color;
      } else {
        const sorted = [...bgColors].sort((a, b) => a.position - b.position);
        const colorStops = sorted.map(c => `${c.color} ${c.position}%`).join(', ');

        if (type === 'linear') {
          const angle = document.getElementById('gradientAngle').value;
          document.body.style.background = `linear-gradient(${angle}deg, ${colorStops})`;
        } else if (type === 'radial') {
          document.body.style.background = `radial-gradient(circle, ${colorStops})`;
        } else if (type === 'conic') {
          document.body.style.background = `conic-gradient(${colorStops})`;
        }
      }
    }

    // Update pattern
    function updatePattern() {
      const type = document.getElementById('patternType').value;

      if (type === 'solid') {
        pattern.style.background = patternColors[0].color;
      } else {
        const sorted = [...patternColors].sort((a, b) => a.position - b.position);
        const colorStops = sorted.map(c => `${c.color} ${c.position}%`).join(', ');

        if (type === 'linear') {
          const angle = document.getElementById('patternGradientAngle').value;
          pattern.style.background = `linear-gradient(${angle}deg, ${colorStops})`;
        } else if (type === 'radial') {
          pattern.style.background = `radial-gradient(circle, ${colorStops})`;
        } else if (type === 'conic') {
          pattern.style.background = `conic-gradient(${colorStops})`;
        }
      }
    }

    // Get current configuration
    function getCurrentConfig() {
      return {
        bgType: document.getElementById('bgType').value,
        bgAngle: parseInt(document.getElementById('gradientAngle').value),
        bgColors: bgColors,
        patternType: document.getElementById('patternType').value,
        patternAngle: parseInt(document.getElementById('patternGradientAngle').value),
        patternColors: patternColors,
        patternOpacity: parseInt(document.getElementById('patternOpacity').value),
        patternSize: parseInt(document.getElementById('patternSize').value),
        patternRotation: parseInt(document.getElementById('patternRotation').value),
        blendMode: document.getElementById('blendMode').value,
        animationSpeed: parseInt(document.getElementById('animationSpeed').value),
        animationDirection: document.getElementById('animationDirection').value,
        animationEnabled: document.getElementById('animationEnabled').checked
      };
    }

    // Export functions
    document.getElementById('saveHtmlBtn').addEventListener('click', () => {
      const config = getCurrentConfig();

      let bgStyle;
      if (config.bgType === 'solid') {
        bgStyle = config.bgColors[0].color;
      } else {
        const sorted = [...config.bgColors].sort((a, b) => a.position - b.position);
        const colorStops = sorted.map(c => `${c.color} ${c.position}%`).join(', ');

        if (config.bgType === 'linear') {
          bgStyle = `linear-gradient(${config.bgAngle}deg, ${colorStops})`;
        } else if (config.bgType === 'radial') {
          bgStyle = `radial-gradient(circle, ${colorStops})`;
        } else {
          bgStyle = `conic-gradient(${colorStops})`;
        }
      }

      let patternBg;
      if (config.patternType === 'solid') {
        patternBg = config.patternColors[0].color;
      } else {
        const sorted = [...config.patternColors].sort((a, b) => a.position - b.position);
        const colorStops = sorted.map(c => `${c.color} ${c.position}%`).join(', ');

        if (config.patternType === 'linear') {
          patternBg = `linear-gradient(${config.patternAngle}deg, ${colorStops})`;
        } else if (config.patternType === 'radial') {
          patternBg = `radial-gradient(circle, ${colorStops})`;
        } else {
          patternBg = `conic-gradient(${colorStops})`;
        }
      }

      const htmlContent = `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blooket Background</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: ${bgStyle};
      height: 100%;
      overflow: hidden;
    }
    .rotated-container {
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      transform: rotate(${config.patternRotation}deg);
      transform-origin: center;
      pointer-events: none;
    }
    .pattern-fill {
      width: 100%;
      height: 100%;
      background: ${patternBg};
      opacity: ${config.patternOpacity / 100};
      mix-blend-mode: ${config.blendMode};
      ${config.animationEnabled ? `animation: movePattern ${config.animationSpeed}s linear infinite ${config.animationDirection};` : ''}
      -webkit-mask-image: url('https://blooket-designing.neocities.org/Assets/Main/BlookCheckers.png');
      -webkit-mask-repeat: repeat;
      -webkit-mask-size: ${config.patternSize}px ${config.patternSize}px;
      -webkit-mask-position: 0 0;
      mask-image: url('https://blooket-designing.neocities.org/Assets/Main/BlookCheckers.png');
      mask-repeat: repeat;
      mask-size: ${config.patternSize}px ${config.patternSize}px;
      mask-position: 0 0;
    }
    @keyframes movePattern {
      0% { mask-position: 0 0; -webkit-mask-position: 0 0; }
      100% { mask-position: 1000px 1000px; -webkit-mask-position: 1000px 1000px; }
    }
  </style>
</head>
<body>
  <div class="rotated-container">
    <div class="pattern-fill"></div>
  </div>
</body>
</html>`;

      const blob = new Blob([htmlContent], { type: 'text/html' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'blook-background-advanced.html';
      link.click();
    });

    document.getElementById('saveImageBtn').addEventListener('click', () => {
      alert('Rendering image...');

      const screenW = window.innerWidth;
      const screenH = window.innerHeight;
      const config = getCurrentConfig();

      // Create background canvas
      const bgCanvas = document.createElement('canvas');
      bgCanvas.width = screenW;
      bgCanvas.height = screenH;
      const bgCtx = bgCanvas.getContext('2d');

      // Draw background
      if (config.bgType === 'solid') {
        bgCtx.fillStyle = config.bgColors[0].color;
        bgCtx.fillRect(0, 0, screenW, screenH);
      } else {
        const sorted = [...config.bgColors].sort((a, b) => a.position - b.position);
        let gradient;

        if (config.bgType === 'linear') {
          const angle = config.bgAngle * Math.PI / 180;
          const x1 = screenW / 2 - Math.cos(angle) * screenW / 2;
          const y1 = screenH / 2 - Math.sin(angle) * screenH / 2;
          const x2 = screenW / 2 + Math.cos(angle) * screenW / 2;
          const y2 = screenH / 2 + Math.sin(angle) * screenH / 2;
          gradient = bgCtx.createLinearGradient(x1, y1, x2, y2);
        } else if (config.bgType === 'radial') {
          gradient = bgCtx.createRadialGradient(screenW/2, screenH/2, 0, screenW/2, screenH/2, Math.max(screenW, screenH)/2);
        } else {
          // Conic not directly supported in canvas - use radial as fallback
          gradient = bgCtx.createRadialGradient(screenW/2, screenH/2, 0, screenW/2, screenH/2, Math.max(screenW, screenH)/2);
        }

        sorted.forEach(c => {
          gradient.addColorStop(c.position / 100, c.color);
        });

        bgCtx.fillStyle = gradient;
        bgCtx.fillRect(0, 0, screenW, screenH);
      }

      // Load and draw pattern
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.src = 'https://blooket-designing.neocities.org/Assets/Main/BlookCheckers.png';

      img.onload = () => {
        const diagonal = Math.ceil(Math.sqrt(screenW ** 2 + screenH ** 2)) * 2;

        // Create pattern canvas
        const patternCanvas = document.createElement('canvas');
        patternCanvas.width = img.width;
        patternCanvas.height = img.height;
        const pctx = patternCanvas.getContext('2d');

        pctx.drawImage(img, 0, 0);
        pctx.globalCompositeOperation = 'source-in';

        // Draw pattern color/gradient
        if (config.patternType === 'solid') {
          pctx.fillStyle = config.patternColors[0].color;
          pctx.fillRect(0, 0, img.width, img.height);
        } else {
          const sorted = [...config.patternColors].sort((a, b) => a.position - b.position);
          let gradient;

          if (config.patternType === 'linear') {
            const angle = config.patternAngle * Math.PI / 180;
            const x1 = img.width / 2 - Math.cos(angle) * img.width / 2;
            const y1 = img.height / 2 - Math.sin(angle) * img.height / 2;
            const x2 = img.width / 2 + Math.cos(angle) * img.width / 2;
            const y2 = img.height / 2 + Math.sin(angle) * img.height / 2;
            gradient = pctx.createLinearGradient(x1, y1, x2, y2);
          } else {
            gradient = pctx.createRadialGradient(img.width/2, img.height/2, 0, img.width/2, img.height/2, Math.max(img.width, img.height)/2);
          }

          sorted.forEach(c => {
            gradient.addColorStop(c.position / 100, c.color);
          });

          pctx.fillStyle = gradient;
          pctx.fillRect(0, 0, img.width, img.height);
        }

        // Create rotated pattern
        const rotCanvas = document.createElement('canvas');
        rotCanvas.width = diagonal;
        rotCanvas.height = diagonal;
        const rotCtx = rotCanvas.getContext('2d');

        rotCtx.save();
        rotCtx.translate(diagonal / 2, diagonal / 2);
        rotCtx.rotate(config.patternRotation * Math.PI / 180);
        rotCtx.translate(-diagonal / 2, -diagonal / 2);

        const patternFill = rotCtx.createPattern(patternCanvas, 'repeat');
        rotCtx.fillStyle = patternFill;
        rotCtx.fillRect(0, 0, diagonal, diagonal);
        rotCtx.restore();

        // Composite onto background
        bgCtx.globalAlpha = config.patternOpacity / 100;
        bgCtx.globalCompositeOperation = config.blendMode;
        const offsetX = (diagonal - screenW) / 2;
        const offsetY = (diagonal - screenH) / 2;
        bgCtx.drawImage(rotCanvas, offsetX, offsetY, screenW, screenH, 0, 0, screenW, screenH);

        // Download
        const link = document.createElement('a');
        link.download = 'blook-background-advanced.png';
        link.href = bgCanvas.toDataURL();
        link.click();
      };
    });

    document.getElementById('copyConfigBtn').addEventListener('click', () => {
      const config = getCurrentConfig();
      const json = JSON.stringify(config, null, 2);
      navigator.clipboard.writeText(json).then(() => {
        alert('Configuration copied to clipboard!');
      });
    });

    document.getElementById('loadConfigBtn').addEventListener('click', () => {
      const json = prompt('Paste configuration JSON:');
      if (!json) return;

      try {
        const config = JSON.parse(json);

        document.getElementById('bgType').value = config.bgType;
        document.getElementById('gradientAngle').value = config.bgAngle;
        document.getElementById('angleDisplay').textContent = config.bgAngle + '°';
        document.getElementById('gradientAngleLabel').style.display = config.bgType === 'linear' ? 'flex' : 'none';

        bgColors = config.bgColors;
        rebuildBackgroundColorStops();

        document.getElementById('patternType').value = config.patternType;
        document.getElementById('patternGradientAngle').value = config.patternAngle;
        document.getElementById('patternAngleDisplay').textContent = config.patternAngle + '°';
        document.getElementById('patternAngleLabel').style.display = config.patternType === 'linear' ? 'flex' : 'none';

        patternColors = config.patternColors;
        rebuildPatternColorStops();

        document.getElementById('patternOpacity').value = config.patternOpacity;
        document.getElementById('patternOpacityDisplay').textContent = config.patternOpacity + '%';
        pattern.style.opacity = config.patternOpacity / 100;

        document.getElementById('patternSize').value = config.patternSize;
        document.getElementById('patternSizeDisplay').textContent = config.patternSize + 'px';
        pattern.style.maskSize = config.patternSize + 'px ' + config.patternSize + 'px';
        pattern.style.webkitMaskSize = config.patternSize + 'px ' + config.patternSize + 'px';

        document.getElementById('patternRotation').value = config.patternRotation;
        document.getElementById('patternRotationDisplay').textContent = config.patternRotation + '°';
        rotatedContainer.style.transform = `rotate(${config.patternRotation}deg)`;

        document.getElementById('blendMode').value = config.blendMode;
        pattern.style.mixBlendMode = config.blendMode;

        document.getElementById('animationSpeed').value = config.animationSpeed;
        document.getElementById('animSpeedDisplay').textContent = config.animationSpeed + 's';

        document.getElementById('animationDirection').value = config.animationDirection;
        document.getElementById('animationEnabled').checked = config.animationEnabled;

        updateAnimation();

        alert('Configuration loaded successfully!');
      } catch (e) {
        alert('Invalid configuration JSON: ' + e.message);
      }
    });

    // Initialize
    setupColorInputs();
    updateBackground();
    updatePattern();
  </script>
</body>
